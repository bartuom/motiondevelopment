<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FXDeck Reference Fidelity Frame</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a1026; }
    body { position: relative; }
    #reference-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #reference-status {
      position: absolute; left: 12px; top: 12px; z-index: 10;
      margin: 0; padding: 5px 8px; border-radius: 6px;
      font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(255,255,255,.72); background: rgba(4,8,18,.72);
      pointer-events: none;
    }
    #reference-status[data-state="ready"] { opacity: .55; }
    #reference-status[data-state="error"] { color: #ffb4b4; opacity: 1; }
  </style>
</head>
<body>
  <canvas id="reference-canvas"></canvas>
  <p id="reference-status">P3.14.1 exact reference booting…</p>
  <script type="module" src="./js/reference-fidelity-frame.js?v=p3.14.1"></script>
</body>
</html>
