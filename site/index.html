<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lightweight browser motion and game FX portfolio built with CSS, JavaScript and sprite sheets.">
  <title>Motion FX Portfolio</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./impact-polish.css">
  <link rel="stylesheet" href="./draw-polish.css">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <div>
        <p class="site-label">Motion Development</p>
        <h1>Motion FX Portfolio</h1>
      </div>
      <p class="stack">CSS · JavaScript · Sprite Sheets</p>
    </header>

    <div class="portfolio-layout">
      <nav class="effect-nav" aria-label="Effect categories">
        <p class="nav-label">Effects</p>
        <button class="effect-nav__item is-active" type="button" data-effect="explosion"><span class="effect-number">01</span><span>Explosions</span><small>Live</small></button>
        <button class="effect-nav__item" type="button" data-effect="flash"><span class="effect-number">02</span><span>Flash</span><small>Live</small></button>
        <button class="effect-nav__item" type="button" data-effect="impact"><span class="effect-number">03</span><span>Impact</span><small>Live</small></button>
        <button class="effect-nav__item" type="button" data-effect="spell"><span class="effect-number">04</span><span>Spell Effects</span><small>Live</small></button>
        <button class="effect-nav__item" type="button" data-effect="draw"><span class="effect-number">05</span><span>Draw Animations</span><small>Live</small></button>
        <button class="effect-nav__item" type="button" data-effect="trails"><span class="effect-number">06</span><span>Trails & Particles</span><small>Live</small></button>
      </nav>

      <section class="demo-panel" aria-labelledby="effect-title">
        <div class="demo-header">
          <div>
            <p class="demo-index" id="demo-index">01 / 06</p>
            <h2 id="effect-title">Explosions</h2>
            <p class="demo-description" id="demo-description"></p>
          </div>
          <div class="runtime-meta" aria-label="Runtime information">
            <span>App FPS <strong id="app-fps">--</strong></span>
            <span id="animation-fps-wrap">Anim FPS <strong id="animation-fps">--</strong></span>
            <span>0 dependencies</span>
            <span>Buildless</span>
          </div>
        </div>

        <div class="stage" id="stage">
          <div class="stage-grid" aria-hidden="true"></div>
          <div id="effect-root" class="effect-root" aria-live="polite"></div>
        </div>

        <div class="demo-controls">
          <div class="variants" id="variant-controls" aria-label="Effect variants"></div>
          <button class="play-button" id="play-button" type="button">Play effect</button>
        </div>

        <div class="technical-strip" id="technical-strip"></div>
      </section>
    </div>
  </main>

  <script src="./js/main.js" defer></script>
</body>
</html>
