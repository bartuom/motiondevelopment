<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="144" viewBox="0 0 1728 144">
  <defs>
    <radialGradient id="hot" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#fff6b0"/>
      <stop offset=".62" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#ff6b1f"/>
    </radialGradient>
    <radialGradient id="fire" cx="44%" cy="40%" r="66%">
      <stop offset="0" stop-color="#ffd85b"/>
      <stop offset=".48" stop-color="#ff8a24"/>
      <stop offset="1" stop-color="#d9431d"/>
    </radialGradient>
    <radialGradient id="smoke" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#7c7770"/>
      <stop offset=".55" stop-color="#4a4744"/>
      <stop offset="1" stop-color="#242424"/>
    </radialGradient>
  </defs>

  <!-- 01 ignition -->
  <g transform="translate(0 0)">
    <circle cx="72" cy="72" r="5" fill="#fff"/>
    <circle cx="72" cy="72" r="11" fill="#ffd75d" opacity=".65"/>
  </g>

  <!-- 02 white-hot break -->
  <g transform="translate(144 0)">
    <path d="M72 41 78 58 95 47 88 64 111 66 90 74 105 92 84 82 79 105 71 84 54 100 58 80 37 88 53 72 34 61 58 62 51 44 67 57Z" fill="#ff7b20"/>
    <circle cx="72" cy="71" r="22" fill="url(#hot)"/>
    <circle cx="67" cy="66" r="8" fill="#fff"/>
  </g>

  <!-- 03 fast expansion -->
  <g transform="translate(288 0)">
    <path d="M33 72c8-14 16-20 25-22 3-15 15-25 29-19 10 4 12 14 13 20 15 2 27 13 25 28-1 10-9 17-18 21-6 15-20 23-35 18-10-3-16-11-18-19-14-2-24-13-21-27Z" fill="#e54b1b"/>
    <path d="M43 71c8-9 15-13 24-13 3-10 11-17 21-15 9 2 13 9 14 17 10 2 17 9 17 18 0 9-6 15-14 19-5 9-13 14-23 12-9-2-14-8-17-15-10-1-18-9-17-18Z" fill="url(#fire)"/>
    <circle cx="72" cy="71" r="21" fill="url(#hot)"/>
    <ellipse cx="64" cy="63" rx="10" ry="8" fill="#fff8cf"/>
  </g>

  <!-- 04 peak -->
  <g transform="translate(432 0)">
    <path d="M22 75c5-15 17-25 30-28-2-13 8-27 23-30 14-2 25 6 31 17 14-4 31 5 35 20 4 13-2 26-12 34 4 15-7 31-22 36-14 4-27-2-35-11-14 8-32 1-39-13-3-6-4-13-2-19-8-1-12-3-9-6Z" fill="#c93619"/>
    <path d="M31 71c7-12 17-18 29-20 1-13 11-22 23-21 11 1 18 9 22 18 12-2 25 6 27 18 2 10-4 19-12 25 1 12-8 22-19 25-11 2-21-2-27-10-11 5-24 0-29-11-3-6-3-12-1-17-7 0-12-3-13-7Z" fill="url(#fire)"/>
    <path d="M49 70c5-8 12-12 20-12 3-9 10-14 18-11 7 2 10 8 11 14 8 1 14 7 14 14 0 8-5 13-11 16-4 7-11 11-18 9-7-2-11-7-13-12-8-1-13-6-13-13Z" fill="url(#hot)"/>
    <ellipse cx="70" cy="62" rx="11" ry="8" fill="#fff" opacity=".92"/>
  </g>

  <!-- 05 fireball starts rolling -->
  <g transform="translate(576 0)">
    <path d="M17 73c6-14 18-23 31-27-1-14 9-27 23-31 14-3 27 5 33 16 15-3 31 7 35 22 3 13-3 25-13 33 4 15-6 31-21 36-14 5-29 0-37-10-14 7-31 1-39-12-4-7-5-15-2-22-8 0-13-2-10-5Z" fill="#8f2d1d" opacity=".9"/>
    <path d="M30 70c7-12 18-18 30-19 2-12 11-22 23-21 11 0 19 8 22 18 13-1 24 8 25 20 1 11-6 20-15 25 0 12-9 22-21 24-11 2-21-3-27-11-11 4-24-2-28-13-2-6-2-12 0-17-6-1-10-3-9-6Z" fill="#e65b20"/>
    <path d="M45 67c6-9 14-13 23-12 3-9 11-15 20-12 8 2 12 9 13 16 8 2 14 8 13 16-1 7-6 13-12 16-4 8-12 12-20 10-7-2-12-7-14-13-8 0-14-6-15-13Z" fill="url(#fire)"/>
    <circle cx="71" cy="67" r="13" fill="#ffd857"/>
  </g>

  <!-- 06 peak heat recedes -->
  <g transform="translate(720 0)">
    <path d="M18 73c5-15 18-24 31-27 1-15 11-26 25-29 14-2 26 6 32 17 16-2 31 8 34 23 3 13-4 26-14 33 3 15-8 30-23 35-14 4-28-2-36-12-15 5-31-2-37-16-3-7-3-14 0-20-8-1-14-2-12-4Z" fill="#49403a"/>
    <path d="M27 69c8-12 19-17 31-17 4-11 13-19 25-17 11 2 18 10 19 20 12 2 22 10 22 21 0 10-7 18-15 22-2 11-11 18-22 19-10 0-19-5-24-13-11 2-22-4-25-15-2-6-1-11 1-16-6-1-10-2-12-4Z" fill="#c94820"/>
    <path d="M45 66c6-8 14-11 23-10 4-8 11-12 19-9 7 3 10 9 10 15 8 2 13 8 12 15-1 7-6 11-12 14-5 7-12 10-19 7-6-2-10-7-11-13-7-1-12-7-12-13Z" fill="url(#fire)"/>
