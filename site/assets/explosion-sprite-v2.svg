  <!-- 07 smoke takes over -->
  <g transform="translate(864 0)">
    <g fill="url(#smoke)">
      <circle cx="43" cy="73" r="28"/>
      <circle cx="67" cy="48" r="31"/>
      <circle cx="95" cy="61" r="29"/>
      <circle cx="85" cy="91" r="31"/>
      <circle cx="54" cy="95" r="26"/>
    </g>
    <path d="M46 70c7-9 15-12 23-10 5-7 12-10 18-6 6 3 8 9 7 14 7 2 11 7 10 13-2 6-7 10-13 11-5 6-12 8-18 5-6-3-9-8-9-13-7-2-12-7-11-13Z" fill="#bd471f"/>
    <ellipse cx="70" cy="68" rx="14" ry="10" fill="#ff9b2d"/>
  </g>

  <!-- 08 dark smoke / embers -->
  <g transform="translate(1008 0)" opacity=".95">
    <g fill="url(#smoke)">
      <circle cx="37" cy="76" r="27"/>
      <circle cx="57" cy="48" r="32"/>
      <circle cx="88" cy="47" r="28"/>
      <circle cx="107" cy="72" r="27"/>
      <circle cx="91" cy="101" r="30"/>
      <circle cx="54" cy="103" r="31"/>
    </g>
    <circle cx="57" cy="78" r="7" fill="#d55524"/>
    <circle cx="78" cy="65" r="5" fill="#ff8d29"/>
    <circle cx="88" cy="87" r="4" fill="#f06e25"/>
  </g>

  <!-- 09 smoke breakup -->
  <g transform="translate(1152 0)" opacity=".82">
    <g fill="#403e3c">
      <circle cx="31" cy="79" r="23"/>
      <circle cx="52" cy="49" r="29"/>
      <circle cx="83" cy="45" r="27"/>
      <circle cx="111" cy="67" r="24"/>
      <circle cx="97" cy="101" r="27"/>
      <circle cx="58" cy="107" r="27"/>
    </g>
    <g fill="#66615c" opacity=".75">
      <circle cx="48" cy="55" r="13"/>
      <circle cx="89" cy="59" r="12"/>
      <circle cx="72" cy="93" r="14"/>
    </g>
    <circle cx="93" cy="80" r="3" fill="#d75b28"/>
    <circle cx="55" cy="82" r="2.5" fill="#ff8430"/>
  </g>

  <!-- 10 smoke drift -->
  <g transform="translate(1296 0)" opacity=".6">
    <g fill="#454442">
      <circle cx="35" cy="78" r="20"/>
      <circle cx="55" cy="48" r="25"/>
      <circle cx="84" cy="43" r="23"/>
      <circle cx="110" cy="67" r="21"/>
      <circle cx="94" cy="99" r="23"/>
      <circle cx="60" cy="105" r="24"/>
    </g>
    <g fill="#76716b" opacity=".55">
      <circle cx="52" cy="58" r="11"/>
      <circle cx="88" cy="59" r="10"/>
    </g>
  </g>

  <!-- 11 dissipate -->
  <g transform="translate(1440 0)" opacity=".38">
    <g fill="#5b5956">
      <circle cx="39" cy="80" r="17"/>
      <circle cx="58" cy="52" r="21"/>
      <circle cx="84" cy="48" r="19"/>
      <circle cx="104" cy="71" r="18"/>
      <circle cx="91" cy="98" r="20"/>
      <circle cx="62" cy="102" r="20"/>
    </g>
  </g>

  <!-- 12 final wisps -->
  <g transform="translate(1584 0)" opacity=".18">
    <g fill="#77736f">
      <circle cx="47" cy="78" r="14"/>
      <circle cx="62" cy="56" r="16"/>
      <circle cx="84" cy="55" r="14"/>
      <circle cx="99" cy="76" r="13"/>
      <circle cx="83" cy="96" r="15"/>
      <circle cx="61" cy="97" r="14"/>
    </g>
  </g>
</svg>
